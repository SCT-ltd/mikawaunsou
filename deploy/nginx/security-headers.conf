# どの応答にも付ける安全のための見出し。default.conf の server と、add_header を書いた
# location の両方から include する（location で add_header を書くと server の分が効かなくなるため）。
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options        "DENY"    always;
add_header Referrer-Policy        "same-origin" always;
# 通信を必ず暗号化させる（Cloudflare の前でも http に落とされないように）
add_header Strict-Transport-Security "max-age=31536000" always;
# 使う機能を絞る（位置情報は打刻ページで使う）
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
# 読み込んでよい先を絞る（画面に悪い文字列が紛れ込んでも、外へ送ったり別の処理を動かしたりできないように）
#   地図の絵＝tile.openstreetmap.org、打刻地点の住所＝nominatim.openstreetmap.org、文字＝Google Fonts
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' https://nominatim.openstreetmap.org; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
