# 三川運送システム — 2つの公開ホストを1つの nginx で捌く
#
#   admin.mikawa-unso.jp … 管理画面（全機能）。2026-07 に Cloudflare Access を外し、アプリのログインで守っている。
#   mikawa-unso.jp       … QR打刻の公開ホスト。Access を掛けない（ドライバーが弾かれるため）。
#
# ホスト名は server_name のパターンで判定しており、ドメインをハードコードしていない:
#   - "admin." で始まる Host → 管理ホスト
#   - それ以外の Host        → 公開ホスト（default_server）
# nginx にはポートを公開しておらず、到達できるのは cloudflared だけなので、
# Cloudflare 側で設定した2ホスト以外はそもそも届かない。

# 記録（アクセスログ）には URL の ? より後ろを残さない。
# QR の合言葉（?k=）がそこに入るため、NAS に入れる人が記録から合言葉を拾えないようにする。
# 参照元（Referer）も同じ理由で残さない。
log_format mikawa_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

# ─────────────────────────────────────────────────────────
# 公開ホスト: QR打刻だけを出す。管理画面と管理APIは一切到達させない。
# ─────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log mikawa_noquery;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 2m;

    include /etc/nginx/mikawa-security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ── 公開APIの allowlist ────────────────────────────────
    # api-server の isPublicDriverFlowRequest()（routes/index.ts）が
    # 「ログイン不要」と認めているエンドポイントだけをここに通す。
    # 加えて /api/auth/me は AuthProvider が全ルートで呼ぶため許可する（未ログインなら 401 が返るだけ）。
    #
    # !!! routes/index.ts の公開エンドポイントを増減したら、この正規表現も必ず合わせること !!!
    #     ここに無いパスは 403 になり、QR画面が無言で壊れる。
    #
    # メソッドの区別はしない（Express 側が method と権限を最終判定する）。
    location ~ ^/api/(auth/me|employees/[0-9]+(/pin/(status|verify|setup))?|attendance/(record|location/live|stream|employee/[0-9]+/(today|month)|checklist/[0-9]+|draft/[0-9]+|records/[0-9]+/(cancel|location)|settings/public|corrections|corrections/mine/[0-9]+|alcohol|alcohol/[0-9]+/today)|messages(/stream|/vapid-public-key|/[0-9]+(/unread-count|/read)?)?|push/subscribe)$ {
        include /etc/nginx/mikawa-proxy.conf;
    }

    # 上記以外のAPI（/api/auth/login、/api/payroll、/api/employees 一覧 など）は
    # 公開ホストからは到達不可にする。ログイン画面ごとインターネットに晒さないため。
    location /api/ {
        return 403;
    }

    # ── QR画面だけ SPA を返す ──────────────────────────────
    location ~ ^/(driver|office)/[0-9]+/?$ {
        # index.html は毎回サーバーに確かめさせる（入れ替え後に古い画面が端末に残らないように）。
        # location の中で add_header を使うと server の分が効かなくなるので、同じものを書き直す。
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/mikawa-security-headers.conf;
        try_files /index.html =404;
    }

    # ── 静的アセット ───────────────────────────────────────
    # Service Worker（Web Push に必須）。キャッシュさせない。
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/mikawa-security-headers.conf;
        try_files /sw.js =404;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/mikawa-security-headers.conf;
        try_files $uri =404;
    }
    location = /favicon.svg   { try_files /favicon.svg =404; }
    location = /theme-init.js { try_files /theme-init.js =404; }
    location = /opengraph.jpg { try_files /opengraph.jpg =404; }
    # ホーム画面に追加するための情報とアイコン（iPhone はホーム画面に追加したときだけプッシュ通知が届く）
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/mikawa-security-headers.conf;
        try_files /manifest.webmanifest =404;
    }
    location = /icon-192.png         { try_files /icon-192.png =404; }
    location = /icon-512.png         { try_files /icon-512.png =404; }
    location = /apple-touch-icon.png { try_files /apple-touch-icon.png =404; }

    # ドメインを直接開いた人（＝事務所の担当者）を管理画面へ送る。
    # 転送先は Cloudflare Access の背後なので、ここで晒しているのはホスト名だけ（DNSで公開済み）。
    # ドライバーはQRで /driver/:id に直接来るので、この転送は踏まない。
    location = / {
        return 302 https://admin.mikawa-unso.jp/;
    }

    # それ以外（管理画面のパス等）は公開ホストには存在しない
    location / {
        return 404;
    }
}

# ─────────────────────────────────────────────────────────
# 管理ホスト: 全機能。アプリのログインで守る（Cloudflare Access は 2026-07 に外した）。
# ─────────────────────────────────────────────────────────
server {
    listen 80;
    server_name admin.*;

    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log mikawa_noquery;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 2m;

    include /etc/nginx/mikawa-security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        include /etc/nginx/mikawa-proxy.conf;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/mikawa-security-headers.conf;
        try_files /sw.js =404;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/mikawa-security-headers.conf;
        try_files $uri =404;
    }

    # SPA（wouter のクライアントルーティング）
    location / {
        try_files $uri /index.html;
    }
    # 上の try_files は /index.html へ内部で回すので、ここで受けてキャッシュさせない指定を付ける。
    # （入れ替え後に古い画面がブラウザに残り、直したはずの表示が出ない事が続いたため）
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/mikawa-security-headers.conf;
    }
}
